include: package:lints/recommended.yaml

analyzer:
  exclude:
    # This nested package has its own Flutter analyzer/test gate.
    - example/flutter_story_app/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
